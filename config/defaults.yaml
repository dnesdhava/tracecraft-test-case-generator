storage:
  base_dir: "./storage"
  audit_log_path: "./storage/audit.jsonl"
  security_audit_log_path: "./storage/security-audit.jsonl"
intake:
  max_upload_bytes: 52428800
  allowed_extensions: [".xlsx", ".md", ".pdf"]
ai:
  provider: "google"
  model_name: "Gemma 4:31B"
  model_id: "gemma-4-31b-it"
  api_key_env_var: "TCG_AI_API_KEY"
  endpoint: "https://generativelanguage.googleapis.com/v1beta"
  timeout_seconds: 30
  max_output_tokens: 1024
  fallback_enabled: true
  context_budget: 2000
validation:
  duplicate_similarity_threshold: 0.85
  duplicate_policy: "warn"
  rule_version: "1.0"
export:
  schema_version: "1.0"
  require_approved: false
  redact_source_excerpts: true
security:
  prompt_injection_blocklist:
    - "ignore all previous instructions"
    - "disregard previous instructions"
    - "reveal the system prompt"
  sensitive_patterns: []
language:
  enforce_english: false
logging:
  level: "INFO"
  format: "json"

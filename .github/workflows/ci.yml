name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]' types-openpyxl types-PyYAML
      - name: Ruff
        run: PYTHONPATH=src python -m ruff check src tests
      - name: Mypy
        run: PYTHONPATH=src python -m mypy src/tcg
      - name: Tests
        run: PYTHONPATH=src python -m pytest --cov=src/tcg --cov-report=term-missing
      - name: Dependency audit
        run: python -m pip_audit
      - name: Secret scan
        run: detect-secrets scan --all-files

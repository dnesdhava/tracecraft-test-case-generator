name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality and package build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up uv and cache dependencies
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check src tests
      - name: Type check
        run: uv run --locked --extra dev mypy src/tcg
      - name: Test
        run: uv run --locked --extra dev pytest --cov=src/tcg --cov-report=term-missing --cov-fail-under=70
      - name: Dependency audit
        run: uv run --locked --extra dev pip-audit
      - name: Secret scan
        run: uv run --locked --extra dev detect-secrets scan --no-verify
      - name: Build package without secrets
        run: uv build --out-dir dist

  deploy:
    name: Deploy package to GitHub Releases
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up uv and cache dependencies
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build release package without secrets
        run: uv build --out-dir dist
      - name: Verify deployment token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GITHUB_TOKEN is required to deploy the package to GitHub Releases."
            exit 1
          fi
      - name: Deploy to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$REPOSITORY" \
            --title "TraceCraft build ${RELEASE_TAG}" \
            --notes "Automated package build for ${COMMIT_SHA}."

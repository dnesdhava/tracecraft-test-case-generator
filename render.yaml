services:
  - type: web
    name: tracecraft-test-case-generator
    runtime: python
    plan: free
    buildCommand: python -m pip install uv==0.12.5 && uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev gunicorn --bind 0.0.0.0:$PORT 'tcg.interfaces.web.app:create_app()'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: TCG_AI_PROVIDER
        value: google
      - key: TCG_AI_MODEL_NAME
        value: "Gemma 4:31B"
      - key: TCG_AI_MODEL_ID
        value: gemma-4-31b-it
      - key: TCG_AI_ENDPOINT
        value: https://generativelanguage.googleapis.com/v1beta
      - key: TCG_AI_API_KEY
        sync: false
      - key: TCG_AI_FALLBACK_ENABLED
        value: "true"
[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-test-case-generator"
version = "0.1.0"
description = "Evidence-grounded AI-powered test case generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
    "jsonschema>=4.20,<5",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
    "types-openpyxl>=3.1,<4",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
tcg = "tcg.interfaces.cli.main:cli"
tcg-web = "tcg.interfaces.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_any_generics = true
